name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-ctest:
    name: Arch build + CTest
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git
          base-devel
          cmake
          ninja
          pkgconf
          qt6-base
          qt6-declarative
          qt6-shadertools
          vulkan-headers
          vulkan-loader
          ffmpeg
          glslang
          python
          python-pytest

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: CTest
        run: ctest --test-dir build --output-on-failure

  python-contracts:
    name: Python contract suite
    runs-on: ubuntu-24.04
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Run PR #7 contract suite
        run: |
          python3 -m pytest -q \
            tests/test_all_candidate_matrix.py \
            tests/test_method_identity.py \
            tests/test_harness_capture_contract.py \
            tests/test_temporal_matrix.py \
            tests/test_quality_runner_contract.py \
            tests/test_event_trace_assembly.py
